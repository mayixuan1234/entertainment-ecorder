                extend: {
                    colors: {
                        caramel: {
                            50: '#FFF8F0',

                            200: '#EBDCC3',
                            300: '#D49356',
                            400: '#C68E5F',
                            500: '#B8865B',
                            600: '#8C5D3A',
                            700: '#4F3426',
                        },

                            900: '#281A12',

                            700: '#4A3022',
                            600: '#573C2E',
                            500: '#704F3B',

                    },
                    fontFamily: {
                        serif: ['Georgia', 'Times New Roman', 'STSong', 'SimSun', 'serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'scale-in': 'scaleIn 0.2s ease-out',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },

        /* 焦糖 · 夜间（无具体主题类时回退） */
        .dark-mode {
            --primary-500: #E8A56B;
            --primary-600: #D49356;
            --primary-700: #F0E2CF;
            --accent-500: #F0A56E;
            --bg-color: #281A12;
            --card-bg: #3B261B;
            --card-bg-alt: #4A3022;
            --text-primary: #ffffff;
            --text-secondary: #E8D4BC;
            --text-muted: #C9B39A;
            --border-color: #573C2E;
            --border-strong: #704F3B;
            --shadow-color: rgba(0, 0, 0, 0.35);
            --shadow-strong: rgba(0, 0, 0, 0.55);
            --header-bg: rgba(40, 26, 18, 0.9);
        }
        body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            position: relative;
            min-height: 100vh;
        }
        .font-serif-deco {
            font-family: 'Georgia', 'Times New Roman', 'STSong', 'SimSun', serif;
        }
        .card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px -8px var(--shadow-strong);
        }
        .input-focus:focus {
            outline: none;
            border-color: var(--primary-500);
            box-shadow: 0 0 0 3px rgba(184, 134, 91, 0.15);
        }
        .category-dropdown-item:hover {
            background-color: var(--card-bg-alt);
        }
        .category-dropdown-item.active {
            background-color: var(--primary-500);
            color: #fff;
        }
        .progress-bar {
            height: 8px;
            border-radius: 4px;
            background-color: var(--border-color);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
            background: linear-gradient(90deg, var(--primary-500), var(--accent-500));
        }
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: var(--card-bg-alt);
            color: var(--text-secondary);
        }
        /* 记录卡章节备注：默认折叠 */
        .chapter-note-wrap {
            margin-top: 0.5rem;
            padding: 0.5rem 0.75rem;
            border-radius: 0.75rem;
            background-color: rgba(59, 130, 246, 0.06);
            border: 1px dashed var(--border-color);
        }
        .chapter-note-text {
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .chapter-note-text.clamped {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .chapter-note-toggle {
            margin-top: 0.25rem;
            font-size: 11px;
            font-weight: 500;
            color: var(--primary-500);
            cursor: pointer;
            background: transparent;
            border: none;
            padding: 0;
        }
        .chapter-note-toggle:hover {
            text-decoration: underline;
        }
        /* 记录卡角色标签栏 */
        .char-tabs-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.25rem;
            scrollbar-width: none;
        }
        .char-tabs-bar::-webkit-scrollbar { display: none; }
        .char-tab {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.375rem 0.75rem;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg-alt);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .char-tab:hover {
            border-color: var(--primary-500);
            color: var(--text-primary);
        }
        .char-tab.active {
            background-color: var(--primary-500);
            border-color: var(--primary-500);
            color: #fff;
            box-shadow: 0 2px 8px var(--shadow-color);
        }
        .char-tab .tab-avatar {
            width: 18px;
            height: 18px;
            border-radius: 999px;
            object-fit: cover;
            border: 1px solid currentColor;
        }
        .char-detail-panel {
            margin-top: 0.75rem;
            padding: 0.75rem;
            border-radius: 0.875rem;
            background-color: var(--card-bg-alt);
            border: 1px solid var(--border-color);
            animation: fadeIn 0.25s ease;
        }
        .char-detail-grid {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 0.75rem;
            align-items: start;
        }
        @media (max-width: 640px) {
            .char-detail-grid {
                grid-template-columns: 90px 1fr;
            }
        }
        .mini-radar-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 0.625rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mini-radar-score {
            position: absolute;
            bottom: 4px;
            right: 4px;
            min-width: 28px;
            padding: 1px 5px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            text-align: center;
            background-color: var(--primary-500);
            color: #fff;
            box-shadow: 0 1px 4px var(--shadow-color);
            pointer-events: none;
        }
        @media (max-width: 640px) {
            .mini-radar-wrap {
                width: 90px;
                height: 90px;
            }
            .mini-radar-wrap canvas {
                width: 80px !important;
                height: 80px !important;
            }
        }
        .char-detail-meta {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .char-detail-note {
            margin-top: 0.5rem;
            padding-left: 0.5rem;
            border-left: 2px solid var(--primary-500);
            font-size: 11px;
            color: var(--text-muted);
            font-style: italic;
            line-height: 1.45;
        }
        /* 弹窗角色编辑标签栏 */
        .modal-char-tabs {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.5rem 0.25rem;
            margin-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }
        .modal-char-tabs::-webkit-scrollbar { display: none; }
        .modal-char-tab {
            flex-shrink: 0;
            padding: 0.375rem 0.875rem;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .modal-char-tab.active {
            background-color: var(--primary-500);
            border-color: var(--primary-500);
            color: #fff;
        }
        .modal-char-tab .tab-remove {
            margin-left: 0.375rem;
            opacity: 0.7;
            transition: opacity 0.15s;
        }
        .modal-char-tab .tab-remove:hover {
            opacity: 1;
            color: #ef4444;
        }
        /* 角色卡内的雷达折叠按钮 */
        .radar-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.375rem 0.75rem;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .radar-toggle-btn:hover {
            border-color: var(--primary-500);
            color: var(--primary-500);
        }
        .radar-toggle-btn.active {
            background-color: var(--primary-500);
            border-color: var(--primary-500);
            color: #fff;
        }
        .radar-panel {
            transition: opacity 0.25s ease, max-height 0.25s ease;
            overflow: hidden;
        }
        .radar-panel.collapsed {
            display: none;
        }
        /* 列表卡片角色头像缩略条 */
        .char-avatar-strip {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .char-avatar-strip .avatar {
            width: 24px;
            height: 24px;
            border-radius: 999px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
            background-color: var(--card-bg);
            cursor: default;
        }
        .char-avatar-strip .avatar-placeholder {
            width: 24px;
            height: 24px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg-alt);
            color: var(--text-muted);
            font-size: 9px;
            border: 1px dashed var(--border-color);
            flex-shrink: 0;
            cursor: default;
        }
        .char-avatar-strip .more-avatars {
            font-size: 10px;
            color: var(--text-muted);
            padding-left: 0.125rem;
            font-weight: 500;
        }
        /* 卡片统一高度与点击态 */
        #recordsContainer > div:not(#emptyState) {
            display: flex;
            flex-direction: column;
            cursor: pointer;
            min-height: 172px;
        }
        #recordsContainer > div:not(#emptyState):hover {
            border-color: var(--primary-500) !important;
        }
        .record-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 0;
        }
        .record-actions {
            display: flex;
            gap: 0.25rem;
            flex-shrink: 0;
        }
        .record-actions button {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            transition: all 0.2s ease;
        }
        .record-actions button:hover {
            background-color: var(--card-bg-alt);
            color: var(--primary-500) !important;
        }
        .record-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.5rem;
            min-width: 0;
        }
        .record-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.35;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            min-width: 0;
            word-break: break-word;
        }
        .record-meta-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            min-width: 0;
        }
        .record-rating-row {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
            min-width: 0;
        }
        .record-note-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            min-width: 0;
        }
        .record-note-bubble {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.25rem 0.625rem;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg-alt);
            color: var(--text-secondary);
            max-width: 100%;
            min-width: 0;
        }
        .record-note-bubble:hover {
            border-color: var(--primary-500);
            color: var(--primary-500);
        }

        function getRecords() {

                    sourceLink: r.sourceLink || '',

                        gender: c.gender || '',

                        species: c.species || '',
                        birthday: c.birthday || '',
                        mbti: c.mbti || '',
                        handedness: c.handedness || '',
                        orientation: c.orientation || '',
                        relationship: c.relationship || '',
                        cp: c.cp || '',

                        roleType: c.roleType || '',
                        faction: c.faction || '',
                        socialClass: c.socialClass || '',
                        organization: c.organization || '',
                        bloodline: c.bloodline || '',
                        faith: c.faith || '',
                        worldRules: c.worldRules || '',
                        inspiration: c.inspiration || '',
                        // 外貌形体
                        appearance: c.appearance || '',
                        physique: c.physique || '',
                        bodyMarks: c.bodyMarks || '',
                        specialOrgans: c.specialOrgans || '',
                        voice: c.voice || '',
                        demeanor: c.demeanor || '',
                        aura: c.aura || '',
                        dressStyle: c.dressStyle || '',
                        colorPref: c.colorPref || '',
                        clothingItems: c.clothingItems || '',
                        battleForm: c.battleForm || '',
                        // 生理体质

                        // 视觉图库与备注
                        imageMain: c.imageMain || '',

                    date: r.date || new Date().toISOString()
                }));
            } catch (e) { return []; }
        }

        function saveRecords(records) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
                updateStats();
                updateBadges();
            } catch (e) { console.error('保存失败:', e); }
        }

        function addRecord(record) {
            const records = getRecords();
            records.unshift(record);
            saveRecords(records);
        }

        function updateRecord(id, updated) {
            const records = getRecords();
            const index = records.findIndex(r => r.id === id);
            if (index !== -1) {
                records[index] = { ...records[index], ...updated };
                saveRecords(records);
            }
        }

        function deleteRecord(id) {
            const records = getRecords();
            saveRecords(records.filter(r => r.id !== id));
        }

        function clearAllData() {
            if (confirm('确定要清空所有记录吗？')) {
                localStorage.removeItem(STORAGE_KEY);
                renderRecords();
                updateStats();
                updateBadges();
            }
        }

        function exportData() {
            const records = getRecords();
            const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `娱乐记录_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function handleImportData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    let recordsToImport = [];
                    if (Array.isArray(imported)) {
                        recordsToImport = imported;
                    } else if (imported && typeof imported === 'object' && Array.isArray(imported.entertainment_records)) {
                        // 来自工作台整合版导出的全部数据
                        recordsToImport = imported.entertainment_records;
                    } else {
                        alert('文件格式错误'); return;
                    }
                    if (confirm(`即将导入 ${recordsToImport.length} 条记录`)) {
                        const existing = getRecords();
                        const existingIds = new Set(existing.map(r => r.id));
                        let added = 0;
                        recordsToImport.forEach(r => {
                            if (!existingIds.has(r.id)) { existing.push(r); added++; }
                        });
                        saveRecords(existing);
                        renderRecords();
                        alert(`成功导入 ${added} 条`);
                    }
                } catch (err) { alert('导入失败'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function updateStats() {
            const records = getRecords();
            document.getElementById('totalCount').textContent = records.length;
            document.getElementById('readingCount').textContent = records.filter(r => r.readStatus === 'reading').length;
            const completed = records.filter(r => r.readStatus === 'completed' || (r.progressCurrent && r.progressTotal && r.progressCurrent >= r.progressTotal)).length;
            document.getElementById('completedCount').textContent = completed;
            
            const now = new Date();
            const monthly = records.filter(r => {
                const d = new Date(r.date);
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear() && r.wordCount;
            }).reduce((sum, r) => sum + r.wordCount, 0);
            document.getElementById('monthlyWords').textContent = monthly.toFixed(1);
        }

        function updateBadges() {
            const records = getRecords();
            const check = (id, condition, color) => {
                const badge = document.getElementById(id);
                if (condition) {
                    badge.style.background = `linear-gradient(135deg, ${color}20, ${color}10)`;
                    badge.style.borderColor = color;
                    badge.querySelector('i').style.color = color;
                }
            };
            check('badge-novel', records.filter(r => r.type === 'novel').length >= 1, '#B8865B');
            check('badge-fanfic', records.filter(r => r.type === 'fanfic').length >= 3, '#ec4899');
            check('badge-tv', records.filter(r => r.type === 'tv').length >= 5, '#8b5cf6');
            check('badge-movie', records.filter(r => r.type === 'movie').length >= 10, '#f97316');
            check('badge-game', records.filter(r => r.type === 'game').length >= 3, '#22c55e');
            check('badge-rating', records.filter(r => r.rating > 0).length >= 5, '#fbbf24');
        }

        function buildCharacterAvatarStripHTML(characters) {
            if (!characters || !characters.length) return '';
            const maxShow = 5;
            const visible = characters.slice(0, maxShow);
            const more = characters.length - maxShow;
            const avatars = visible.map((c, idx) => {
                const name = c.name || `角色${idx + 1}`;
                if (c.image) {
                    return `<img src="${esc(c.image)}" alt="${esc(name)}" class="avatar" title="${esc(name)}" onerror="this.style.display='none'">`;
                }
                return `<div class="avatar-placeholder" title="${esc(name)}"><i class="fa-solid fa-user"></i></div>`;
            }).join('');
            const moreHtml = more > 0 ? `<span class="more-avatars">+${more}</span>` : '';
            return `<div class="char-avatar-strip">${avatars}${moreHtml}</div>`;
        }

        function buildCharacterTabsHTML(characters) {
            const roleLabel = (role) => {
                const found = CHARACTER_ROLE_OPTIONS.find(o => o.value === role);
                return found ? found.label : '';
            };
            const tabs = characters.map((c, idx) => {
                const avatar = c.image
                    ? `<img src="${c.image}" alt="" class="tab-avatar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="w-[18px] h-[18px] rounded-full items-center justify-center hidden" style="background:var(--card-bg);color:var(--text-muted);"><i class="fa-solid fa-user text-[8px]"></i></div>`
                    : `<div class="w-[18px] h-[18px] rounded-full flex items-center justify-center" style="background:var(--card-bg);color:var(--text-muted);"><i class="fa-solid fa-user text-[8px]"></i></div>`;
                const name = c.name || `角色${idx + 1}`;
                return `<button type="button" class="char-tab ${idx === 0 ? 'active' : ''}" data-char-idx="${idx}">${avatar}<span>${esc(name)}</span></button>`;
            }).join('');

            const panels = characters.map((c, idx) => {
                const label = roleLabel(c.role);
                const genderAge = [c.gender, c.age].filter(Boolean).join(' · ');
                const occ = c.occupation || '';
                const metaRows = [];
                if (genderAge || occ) metaRows.push([genderAge, occ].filter(Boolean).join(' · '));
                if (c.height || c.weight) metaRows.push([c.height, c.weight].filter(Boolean).join(' / '));
                if (c.species) metaRows.push(c.species);
                if (c.faction || c.socialClass) metaRows.push([c.faction, c.socialClass].filter(Boolean).join(' · '));
                if (c.mbti) metaRows.push(`MBTI：${c.mbti}`);
                if (c.cp) metaRows.push(`CP：${c.cp}`);
                const tagsHtml = (c.tags && c.tags.length)
                    ? `<div class="flex flex-wrap gap-1 mt-2">${c.tags.map(t => `<span class="px-1.5 py-0.5 rounded-md text-[10px]" style="background:var(--card-bg);color:var(--text-secondary);border:1px solid var(--border-color);">${t}</span>`).join('')}</div>`
                    : '';
                const detailNote = c.note || c.motto || c.catchphrase || '';
                const radarValues = c.radar || {};
                const radarAvg = (RADAR_AXES.reduce((sum, a) => sum + (Number(radarValues[a.key]) || 0), 0) / RADAR_AXES.length).toFixed(1);
                return `
                    <div class="char-detail-panel ${idx === 0 ? '' : 'hidden'}" data-char-panel="${idx}">
                        <div class="char-detail-grid">
                            <div class="mini-radar-wrap">
                                <canvas class="mini-radar" width="100" height="100" data-char-idx="${idx}"></canvas>
                                <span class="mini-radar-score">${radarAvg}</span>
                            </div>
                            <div class="min-w-0">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="font-medium text-sm" style="color:var(--text-primary);">${c.name || `角色${idx + 1}`}</span>
                                    ${label ? `<span class="text-[10px] px-1.5 py-0.5 rounded-md" style="background-color:var(--primary-500);color:#fff;">${label}</span>` : ''}
                                </div>
                                <div class="char-detail-meta mt-1">
                                    ${metaRows.length ? metaRows.map(m => `<div class="truncate" title="${esc(m)}">${esc(m)}</div>`).join('') : '<div style="color:var(--text-muted);">暂无详细设定</div>'}
                                </div>
                                ${tagsHtml}
                            </div>
                        </div>
                        ${detailNote ? `<div class="char-detail-note">${esc(detailNote)}</div>` : ''}
                    </div>
                `;
            }).join('');

            return `
                <div class="character-tabs mt-3 select-none">
                    <div class="char-tabs-bar">
                        ${tabs}
                    </div>
                    ${panels}
                </div>
            `;
        }

        function initCharacterTabs(card, recordId) {
            const tabs = card.querySelectorAll('.char-tab');
            const panels = card.querySelectorAll('.char-detail-panel');
            if (!tabs.length) return;
            const show = (idx) => {
                tabs.forEach((t, i) => t.classList.toggle('active', i === idx));
                panels.forEach((p, i) => p.classList.toggle('hidden', i !== idx));
            };
            tabs.forEach(t => t.addEventListener('click', (e) => { e.stopPropagation(); show(parseInt(t.dataset.charIdx)); }));
            // mini radar charts
            const characters = (getRecords().find(r => r.id === recordId) || {}).characters || [];
            card.querySelectorAll('.mini-radar').forEach(mc => {
                const idx = parseInt(mc.dataset.charIdx);
                const charData = characters[idx];
                setTimeout(() => drawRadarChart(mc, (charData && charData.radar) ? charData.radar : getDefaultRadar(), 100), 0);
            });
        }

        function renderNoteTriggers(record) {
            const parts = [];
            if (record.chapterNote && record.chapterNote.trim()) {
                const text = record.chapterNote.trim().replace(/\n/g, ' ');
                parts.push(`<span class="record-note-bubble chapter" data-note-type="章节备注" data-note-content="${esc(record.chapterNote)}" title="${esc(text)}"><i class="fa-solid fa-bookmark"></i><span class="record-note-text">${esc(text)}</span></span>`);
            }
            if (record.note && record.note.trim()) {
                const text = record.note.trim().replace(/\n/g, ' ');
                parts.push(`<span class="record-note-bubble general" data-note-type="备注" data-note-content="${esc(record.note)}" title="${esc(text)}"><i class="fa-solid fa-comment-dots"></i><span class="record-note-text">${esc(text)}</span></span>`);
            }
            return `<div class="record-note-row">${parts.join('')}</div>`;
        }

        function openNoteModal(title, content) {
            document.getElementById('noteModalTitle').textContent = title;
            document.getElementById('noteModalContent').textContent = content;
            document.getElementById('noteModal').classList.remove('hidden');
        }

        function closeNoteModal() {
            document.getElementById('noteModal').classList.add('hidden');
        }

        function renderRecords() {
            const records = getRecords();
            const container = document.getElementById('recordsContainer');
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = records;
            if (currentTypeFilter !== 'all') {
                filtered = filtered.filter(r => r.type === currentTypeFilter);
            }
            if (currentStatusFilter !== 'all') {
                filtered = filtered.filter(r => r.readStatus === currentStatusFilter);
            }
            if (searchText) {
                filtered = filtered.filter(r =>
                    r.name.toLowerCase().includes(searchText) ||
                    (r.note && r.note.toLowerCase().includes(searchText)) ||
                    (r.tags && r.tags.some(t => t.toLowerCase().includes(searchText)))
                );
            }
            filtered.sort((a, b) => {
                switch (currentSort) {
                    case 'newest': return new Date(b.date) - new Date(a.date);
                    case 'oldest': return new Date(a.date) - new Date(b.date);
                    case 'rating': return b.rating - a.rating;
                    case 'name': return a.name.localeCompare(b.name, 'zh-CN');
                    default: return 0;
                }
            });

            document.getElementById('countBadge').textContent = `共 ${filtered.length} 条`;
            container.innerHTML = '';
            
            const emptyState = document.createElement('div');
            emptyState.id = 'emptyState';
            emptyState.className = 'col-span-full py-16 text-center';
            emptyState.innerHTML = `
                <div class="w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center" style="background-color: var(--card-bg);">
                    <i class="fa-solid fa-inbox text-4xl" style="color: var(--text-muted);"></i>
                </div>
                <p style="color: var(--text-secondary);">暂无记录</p>
                <button onclick="openAddModal()" class="mt-3 px-5 py-2 rounded-lg text-white text-sm font-medium hover:brightness-110 transition-all inline-flex items-center gap-1.5" style="background-color: var(--primary-500);">
                    <i class="fa-solid fa-plus"></i> 添加第一条记录
                </button>
            `;
            container.appendChild(emptyState);

            if (filtered.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            filtered.forEach(record => {
                const config = TYPE_CONFIG[record.type] || TYPE_CONFIG.novel;
                const card = document.createElement('div');
                card.className = 'rounded-xl p-4 card-hover animate-slide-up overflow-hidden';
                card.style.background = 'var(--card-bg)';
                card.style.border = '1px solid var(--border-color)';

                // 卡片主体点击打开详情/编辑弹窗（按钮区阻止冒泡）
                card.onclick = (e) => {
                    if (e.target.closest('button') || e.target.closest('a')) return;
                    openEditModal(record.id);
                };

                const stars = Array(5).fill(0).map((_, i) =>
                    `<i class="fa-solid fa-star ${i < record.rating ? 'text-yellow-400' : 'text-gray-200'} text-xs"></i>`
                ).join('');

                const status = READ_STATUS_CONFIG[record.readStatus];
                const statusBadge = status
                    ? `<span class="px-2 py-0.5 rounded-full text-[11px] font-medium ${status.color}">${status.label}</span>`
                    : '';

                const progress = record.progressCurrent && record.progressTotal
                    ? `<div class="w-full"><div class="flex justify-between text-[11px] mb-1" style="color: var(--text-muted);"><span>进度</span><span>${record.progressCurrent}/${record.progressTotal}</span></div><div class="progress-bar"><div class="progress-fill" style="width: ${Math.min(100, (record.progressCurrent/record.progressTotal)*100)}%"></div></div></div>`
                    : '';

                const characters = record.characters || [];
                const characterBlock = characters.length
                    ? buildCharacterAvatarStripHTML(characters)
                    : '';

                card.innerHTML = `
                    <div class="record-body">
                        <!-- ① 标题 + 操作按钮 -->
                        <div class="record-title-row">
                            <h3 class="record-title" title="${esc(record.name)}">${esc(record.name)}</h3>
                            <div class="record-actions">
                                <button onclick="openEditModal('${record.id}')" title="编辑 / 详情"><i class="fa-solid fa-pen-to-square text-xs"></i></button>
                                <button onclick="openDeleteModal('${record.id}')" title="删除"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                        </div>

                        <!-- ② 作品类型 + 状态 -->
                        <div class="record-meta-row">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium ${config.color}">
                                <i class="fa-solid ${config.icon}"></i> ${config.label}
                            </span>
                            ${statusBadge}
                        </div>

                        <!-- ③ 星级评分 + 进度条 -->
                        <div class="record-rating-row">
                            <div class="flex items-center gap-1">${stars}</div>
                            ${progress}
                        </div>

                        <!-- ④ 备注气泡 -->
                        ${(record.chapterNote || record.note) ? renderNoteTriggers(record) : ''}

                        <!-- ⑤ 关联角色头像 -->
                        ${characterBlock ? `<div class="record-characters-row">${characterBlock}</div>` : ''}
                    </div>
                `;
                container.appendChild(card);

                // 初始化笔记入口弹窗
                card.querySelectorAll('.record-note-bubble').forEach(trigger => {
                    trigger.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openNoteModal(trigger.dataset.noteType, trigger.dataset.noteContent);
                    });
                });
            });
        }

        function openEditModal(id) {
            const record = getRecords().find(r => r.id === id);
            if (!record) return;

            const modal = document.getElementById('editModal');
            modal.classList.remove('hidden');
            modal.scrollTop = 0;
            document.getElementById('editId').value = record.id;
            document.getElementById('editName').value = record.name || '';
            document.getElementById('editRating').value = record.rating || 0;
            document.getElementById('editProgressCurrent').value = record.progressCurrent || '';
            document.getElementById('editProgressTotal').value = record.progressTotal || '';
            document.getElementById('editTags').value = (record.tags || []).join(', ');
            document.getElementById('editNote').value = record.note || '';
            document.getElementById('editAuthor').value = record.author || '';
            setCustomSelectValue('editType', record.type || 'novel');
            setCustomSelectValue('editReadStatus', record.readStatus || 'reading');
            setCustomSelectValue('editPlatform', record.platform || '');
            document.getElementById('editWordCount').value = record.wordCount || '';

            document.getElementById('editChapterNote').value = record.chapterNote || '';

            document.querySelectorAll('#editStarRating i').forEach(s => {

            document.getElementById('editNovelFields').classList.toggle('hidden', !(record.type === 'novel' || record.type === 'fanfic'));
            updateCpVisibility('edit', record.type || '');
            document.getElementById('editModal').classList.remove('hidden');

        function handleEditSubmit(e) {

            const id = document.getElementById('editId').value;
            updateRecord(id, {
                name: document.getElementById('editName').value.trim(),
                type: document.getElementById('editType').value,

                progressCurrent: parseInt(document.getElementById('editProgressCurrent').value) || 0,
                progressTotal: parseInt(document.getElementById('editProgressTotal').value) || 0,
                readStatus: document.getElementById('editReadStatus').value,

                platform: document.getElementById('editPlatform').value,
                wordCount: parseFloat(document.getElementById('editWordCount').value) || 0,

        function setCustomSelect(id, value, label) {
            const input = document.getElementById(id);
            if (input) input.value = value;
            const labelEl = document.getElementById(id + 'Label');
            if (labelEl) {
                labelEl.textContent = label;
                labelEl.classList.remove('placeholder');
            }
            document.querySelectorAll(`#${id}Dropdown .custom-select-option`).forEach(btn => {
                btn.classList.toggle('active', btn.dataset.value === value);
            });
            closeCustomSelect(id);
            // 类型变更联动小说字段与 CP 字段
            if (id === 'type' || id === 'editType') {
                const prefix = id === 'type' ? '' : 'edit';
                document.getElementById(prefix + 'NovelFields').classList.toggle('hidden', !(value === 'novel' || value === 'fanfic'));
                updateCpVisibility(id === 'type' ? 'add' : 'edit', value);
            }
        }

        function setCustomSelectValue(id, value) {
            const opts = CUSTOM_SELECT_OPTIONS[id];
            let label = opts ? opts[value] : value;
            const labelEl = document.getElementById(id + 'Label');
            if (label === undefined) {
                if (id === 'type' || id === 'editType') label = '请选择类型';
                else if (id === 'platform' || id === 'editPlatform') label = '请选择';
                else label = '';
            }
            // 设置值并更新 active，但不触发联动（用于回填初始化）
            const input = document.getElementById(id);
            if (input) input.value = value;
            if (labelEl) {
                labelEl.textContent = label;
                if (!value && (id === 'type' || id === 'editType' || id === 'platform' || id === 'editPlatform')) {
                    labelEl.classList.add('placeholder');
                } else {
                    labelEl.classList.remove('placeholder');
                }
            }
            document.querySelectorAll(`#${id}Dropdown .custom-select-option`).forEach(btn => {
                btn.classList.toggle('active', btn.dataset.value === value);
            });
        }

        function toggleCharSelectOptions(trigger) {
            const wrapper = trigger.closest('.char-select-wrapper, .char-multi-wrapper');
            if (!wrapper) return;
            const opts = wrapper.querySelector('.char-select-options');
            if (!opts) return;
            const hidden = opts.classList.toggle('hidden');
            const icon = trigger.querySelector('i');
            if (icon) icon.style.transform = hidden ? 'rotate(0deg)' : 'rotate(180deg)';
            // 绑定选项点击事件（一次性）
            if (!opts.dataset.bound) {
                opts.dataset.bound = '1';
                opts.querySelectorAll('.char-option').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const input = wrapper.querySelector('.char-select-input, .char-multi-input');
                        if (input) {
                            if (input.classList.contains('char-multi-input')) {
                                addCharMultiValue(wrapper, btn.dataset.value);
                            } else {
                                input.value = btn.dataset.value;
                            }
                        }
                        opts.classList.add('hidden');
                    });
                });
            }
        }

        function addCharMultiValue(wrapper, value) {
            const container = wrapper.querySelector('.char-multi-tags');
            const input = wrapper.querySelector('.char-multi-input');
            const key = container.dataset.char;
            const tag = document.createElement('span');
            tag.className = 'char-multi-tag inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md text-[10px]';
            tag.style.cssText = 'background-color: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-secondary);';
            tag.innerHTML = `${esc(value)}<button type="button" onclick="removeCharMultiTag(this, '${key}')" class="hover:text-red-400"><i class="fa-solid fa-xmark text-[8px]"></i></button>`;
            container.insertBefore(tag, input);
        }

        function addCharMultiOption(btn, key) {
            const wrapper = btn.closest('.char-multi-wrapper');
            if (wrapper) addCharMultiValue(wrapper, btn.dataset.value);
        }

        function removeCharMultiTag(btn, key) {
            const tag = btn.closest('.char-multi-tag');
            if (tag) tag.remove();
        }

        function handleCharMultiKey(event, key) {
            if (event.key === 'Enter' || event.key === ',') {
                event.preventDefault();
                const input = event.target;
                const val = input.value.trim();
                if (val) {
                    const wrapper = input.closest('.char-multi-wrapper');
                    addCharMultiValue(wrapper, val);
                    input.value = '';
                }
            } else if (event.key === 'Backspace' && !event.target.value) {
                const wrapper = event.target.closest('.char-multi-wrapper');
                const tags = wrapper.querySelectorAll('.char-multi-tag');
                if (tags.length) tags[tags.length - 1].remove();
            }
        }

        function updateCharSliderLabel(slider) {
            const wrapper = slider.closest('label');
            const val = wrapper.querySelector('.char-slider-val');
            if (val) val.textContent = slider.value;
        }

        function toggleCharRadarPanel(btn) {
            const card = btn.closest('.character-card');
            const panel = card.querySelector('.radar-panel');
            const isCollapsed = panel.classList.toggle('collapsed');
            btn.classList.toggle('active', !isCollapsed);
            btn.innerHTML = isCollapsed
                ? '<i class="fa-solid fa-chart-radar"></i> 能力图'
                : '<i class="fa-solid fa-chevron-up"></i> 收起能力图';
            // 重新绘制雷达，防止折叠后 canvas 尺寸异常
            if (!isCollapsed) {
                const canvas = panel.querySelector('.char-radar');
                if (canvas) {
                    const radar = {};
                    card.querySelectorAll('.char-radar-num').forEach(i => radar[i.dataset.key] = parseFloat(i.value) || 0);
                    setTimeout(() => drawRadarChart(canvas, radar, 180, '角色能力'), 50);
                }
            }

        /* =========================================================
           角色档案图片导出（html2canvas）
           ========================================================= */
        async function exportCharacterArchive(mode = 'edit') {
            const containerId = mode === 'edit' ? 'editCharactersContainer' : 'charactersContainer';
            const container = document.getElementById(containerId);
            if (!container) return;
            const cards = container.querySelectorAll('.character-card');
            if (!cards.length) {
                alert('暂无角色档案可导出，请先添加角色。');
                return;
            }
            if (typeof html2canvas === 'undefined') {
                alert('导出组件加载中，请稍后重试。');
                return;
            }

            // 1) 记住当前折叠状态（导出后恢复用）
            const originalState = [];
            cards.forEach(card => {
                const radarPanel = card.querySelector('.radar-panel');
                const sections = card.querySelectorAll('.char-section');
                originalState.push({
                    radarCollapsed: radarPanel ? radarPanel.classList.contains('collapsed') : true,
                    sections: Array.from(sections).map(s => {
                        const body = s.querySelector('.char-section-body');
                        return body ? body.classList.contains('hidden') : false;
                    })
                });
            });

            const recordName = document.getElementById(mode === 'edit' ? 'editName' : 'name')?.value?.trim() || '作品';
            const bg = getComputedStyle(document.body).backgroundColor || '#ffffff';
            let exported = 0;

            try {
                // 2) 强制展开所有面板并刷新雷达图
                cards.forEach(card => {
                    const radarPanel = card.querySelector('.radar-panel');
                    const radarBtn = card.querySelector('.radar-toggle-btn');
                    if (radarPanel) {
                        radarPanel.classList.remove('collapsed');
                        radarPanel.style.display = 'flex';
                    }
                    if (radarBtn) {
                        radarBtn.classList.add('active');
                        radarBtn.innerHTML = '<i class="fa-solid fa-chevron-up"></i> 收起能力图';
                    }
                    card.querySelectorAll('.char-section').forEach(section => {
                        const body = section.querySelector('.char-section-body');
                        const icon = section.querySelector('button i');
                        if (body) {
                            body.classList.remove('hidden');
                            body.style.display = 'block';
                        }
                        if (icon) icon.style.transform = 'rotate(180deg)';
                    });
                    const canvas = card.querySelector('.char-radar');
                    if (canvas) {
                        const radar = {};
                        card.querySelectorAll('.char-radar-num').forEach(i => {
                            radar[i.dataset.key] = parseFloat(i.value) || 0;
                        });
                        drawRadarChart(canvas, radar, canvas.width, '角色能力');
                    }
                });

                await new Promise(r => requestAnimationFrame(r));
                await new Promise(r => setTimeout(r, 400));

                // 3) 逐卡导出：每张角色卡单独一张高清图（分割导出，避免超长图模糊）
                for (let idx = 0; idx < cards.length; idx++) {
                    const card = cards[idx];
                    const clone = card.cloneNode(true);
                    cleanArchiveClone(clone);

                    // 单卡固定 800px 宽，高度按内容自适应
                    clone.style.cssText = 'width:800px; max-width:800px; margin:0; box-sizing:border-box;';
                    const wrap = document.createElement('div');
                    wrap.className = 'character-archive-export';
                    wrap.style.cssText = 'position:fixed; left:-9999px; top:0; width:800px; z-index:-1; overflow:hidden; background:' + bg + ';';
                    wrap.appendChild(clone);
                    document.body.appendChild(wrap);

                    const rect = clone.getBoundingClientRect();
                    const canvas = await html2canvas(clone, {
                        scale: 3,
                        useCORS: true,
                        allowTaint: true,
                        backgroundColor: bg,
                        width: 800,
                        height: Math.max(rect.height, 100),
                        logging: false
                    });
                    wrap.remove();

                    const link = document.createElement('a');
                    const suffix = cards.length > 1 ? '_' + (idx + 1) : '';
                    link.download = `角色档案_${recordName}${suffix}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    exported++;
                    await new Promise(r => setTimeout(r, 300));
                }

                alert(`已导出 ${exported} 张角色档案图片，每张为高清分割图。`);
            } catch (err) {
                console.error('导出角色档案失败:', err);
                alert('导出失败：' + (err.message || '未知错误'));
            } finally {
                // 4) 恢复折叠状态
                cards.forEach((card, idx) => {
                    const state = originalState[idx];
                    const radarPanel = card.querySelector('.radar-panel');
                    const radarBtn = card.querySelector('.radar-toggle-btn');
                    if (radarPanel) {
                        if (state.radarCollapsed) {
                            radarPanel.classList.add('collapsed');
                            radarPanel.style.display = '';
                        } else {
                            radarPanel.style.display = '';
                        }
                    }
                    if (radarBtn) {
                        if (state.radarCollapsed) {
                            radarBtn.classList.remove('active');
                            radarBtn.innerHTML = '<i class="fa-solid fa-chart-radar"></i> 能力图';
                        } else {
                            radarBtn.innerHTML = '<i class="fa-solid fa-chevron-up"></i> 收起能力图';
                        }
                    }
                    card.querySelectorAll('.char-section').forEach((section, sIdx) => {
                        const body = section.querySelector('.char-section-body');
                        const icon = section.querySelector('button i');
                        if (body) {
                            if (state.sections[sIdx]) {
                                body.classList.add('hidden');
                                body.style.display = '';
                            } else {
                                body.style.display = '';
                            }
                        }
                        if (icon) icon.style.transform = state.sections[sIdx] ? 'rotate(0deg)' : 'rotate(180deg)';
                    });
                });
            }
        }

        function cleanArchiveClone(clone) {
            // 1) 分区标题：把 toggleCharSection 按钮替换为静态标题元素（保留标题文字）
            clone.querySelectorAll('.char-section').forEach(section => {
                const btn = section.querySelector('button[onclick*="toggleCharSection"]');
                if (btn) {
                    const title = btn.textContent.trim();
                    const titleEl = document.createElement('div');
                    titleEl.className = 'archive-section-title';
                    titleEl.textContent = title;
                    titleEl.style.cssText = 'font-size:13px;font-weight:600;color:var(--primary-500);padding:8px 12px;border-left:3px solid var(--primary-500);background:var(--card-bg);border-radius:0 8px 0 0;';
                    btn.parentNode.replaceChild(titleEl, btn);
                }
            });

            // 2) 删除剩余交互按钮（删除卡片、折叠雷达图、新增角色等）
            clone.querySelectorAll('button').forEach(btn => {
                const onclick = btn.getAttribute('onclick') || '';
                if (onclick.includes('removeCharacterCard') ||
                    onclick.includes('toggleCharRadarPanel') ||
                    onclick.includes('toggleCharSection') ||
                    onclick.includes('addCharacterRow') ||
                    btn.classList.contains('char-tab-add')) {
                    btn.remove();
                }
            });
            clone.querySelectorAll('.modal-char-tabs').forEach(el => el.remove());

            // 3) 清理隐藏的下拉选项面板和下拉箭头按钮
            clone.querySelectorAll('.char-select-options').forEach(el => el.remove());

            // 4) 头像 URL 提取并生成图片（在 input 转文本之前处理）
            clone.querySelectorAll('.character-card').forEach(card => {
                const imgInput = card.querySelector('input.char-image');
                const firstRow = imgInput?.closest('.flex');
                if (firstRow) {
                    const url = (imgInput.value || '').trim();
                    const nameInput = card.querySelector('input.char-name');
                    const name = nameInput ? nameInput.value.trim() : '';
                    const header = document.createElement('div');
                    header.className = 'archive-char-header';
                    header.style.cssText = 'display:flex; align-items:center; gap:1rem; margin-bottom:1rem; padding-bottom:1rem; border-bottom:1px solid var(--border-color);';
                    if (url) {
                        const img = document.createElement('img');
                        img.src = url;
                        img.crossOrigin = 'anonymous';
                        img.referrerPolicy = 'no-referrer';
                        img.className = 'archive-avatar';
                        img.style.cssText = 'width:80px; height:80px; border-radius:999px; object-fit:cover; border:2px solid var(--border-color); background:var(--card-bg);';
                        img.onerror = function() {
                            this.style.display = 'none';
                            const ph = document.createElement('div');

            // 5) 把 input / select / textarea 转成只读文本
            clone.querySelectorAll('input, select, textarea').forEach(input => {
                const tag = input.tagName.toLowerCase();
                let text = '';

                } else if (input.type === 'range') {
                    text = input.value;
                } else {
                    text = input.value;

                if (input.classList.contains('char-image')) return; // 已在上方处理

                span.textContent = text;
                span.title = text;
                span.style.cssText = 'display:inline-block; color:var(--text-primary); word-break:break-word; max-width:100%;';
                if (tag === 'textarea') {
                    span.style.whiteSpace = 'pre-wrap';

                input.parentNode.replaceChild(span, input);
            });

            // 6) 空字段隐藏（含其标签），而非显示 —
            clone.querySelectorAll('.archive-value').forEach(span => {
                if (!span.textContent.trim()) {
                    // 向上查找最近的 label 或 flex-col 容器并隐藏整个字段

                    c.parentNode.replaceChild(img, c);
                } catch(e) { /* canvas 跨域则保留原 canvas */ }
            });
        }


        function drawRadarChart(canvas, values, size = 200, title = '') {
            title = title || canvas.dataset.title || '';
            const ctx = canvas.getContext('2d');
            // Canvas 2D cannot resolve CSS var(); resolve from computed style so colors follow the active theme
            const cssVar = (name, fb) => {
                const v = getComputedStyle(canvas).getPropertyValue(name).trim();
                return v || fb;
            };
            const cx = size / 2;
            const cy = size / 2 + (title ? 10 : 0);
            const maxR = size * 0.35;
            const n = RADAR_AXES.length;

            ctx.clearRect(0, 0, size, size);

            ctx.save();
            // Title
            if (title) {
                ctx.fillStyle = cssVar('--text-primary', '#f0f0f0');
                ctx.font = 'bold 13px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(title, size / 2, 4);
            }

            // Grid rings
            for (let level = 1; level <= 5; level++) {
                const r = (maxR * level) / 5;
                ctx.beginPath();
                for (let i = 0; i <= n; i++) {
                    const angle = (Math.PI * 2 * i) / n - Math.PI / 2;
                    const x = cx + Math.cos(angle) * r;
                    const y = cy + Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = cssVar('--border-color', 'rgba(255,255,255,0.25)');
                ctx.lineWidth = level === 5 ? 1.2 : 0.6;
                ctx.globalAlpha = level === 5 ? 0.6 : 0.3;
                ctx.stroke();
            }

            // Axes
            for (let i = 0; i < n; i++) {
                const angle = (Math.PI * 2 * i) / n - Math.PI / 2;
                const x2 = cx + Math.cos(angle) * maxR;
                const y2 = cy + Math.sin(angle) * maxR;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = cssVar('--border-color', 'rgba(255,255,255,0.25)');
                ctx.lineWidth = 0.6;
                ctx.globalAlpha = 0.3;
                ctx.stroke();
            }

            // Average polygon
            const avg = RADAR_AXES.reduce((sum, a) => sum + (values[a.key] || 0), 0) / n;
            ctx.beginPath();
            for (let i = 0; i <= n; i++) {
                const idx = i % n;
                const angle = (Math.PI * 2 * idx) / n - Math.PI / 2;
                const r = (maxR * avg) / 10;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.setLineDash([3, 3]);
            ctx.lineWidth = 1.2;
            ctx.globalAlpha = 0.8;
            ctx.stroke();
            ctx.setLineDash([]);

            // Data polygon
            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
            grad.addColorStop(0, 'rgba(231, 194, 109, 0.6)');
            grad.addColorStop(1, 'rgba(32, 81, 125, 0.3)');
            ctx.beginPath();
            for (let i = 0; i <= n; i++) {
                const idx = i % n;
                const angle = (Math.PI * 2 * idx) / n - Math.PI / 2;
                const val = values[RADAR_AXES[idx].key] || 0;
                const r = (maxR * val) / 10;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.fillStyle = grad;
            ctx.globalAlpha = 0.75;
            ctx.fill();
            ctx.strokeStyle = '#e7c26d';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.9;
            ctx.stroke();

            // Data points
            for (let i = 0; i < n; i++) {
                const angle = (Math.PI * 2 * i) / n - Math.PI / 2;
                const val = values[RADAR_AXES[i].key] || 0;
                const r = (maxR * val) / 10;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                ctx.beginPath();
                ctx.arc(x, y, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = '#e7c26d';
                ctx.globalAlpha = 0.95;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            // Average value label in center
            if (size >= 140) {
                ctx.globalAlpha = 1;
                ctx.fillStyle = cssVar('--text-primary', '#f0f0f0');
                ctx.font = 'bold 12px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(avg.toFixed(1), cx, cy);
            }

            // Labels：小尺寸雷达图省略标签，避免溢出裁切
            if (size >= 120) {
                ctx.globalAlpha = 1;
                ctx.fillStyle = cssVar('--text-secondary', '#d6d6d6');
                ctx.font = '11px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for (let i = 0; i < n; i++) {
                    const angle = (Math.PI * 2 * i) / n - Math.PI / 2;
                    const lx = cx + Math.cos(angle) * (maxR + 14);
                    const ly = cy + Math.sin(angle) * (maxR + 14);
                    ctx.fillText(RADAR_AXES[i].label, lx, ly);
                }
            }
            ctx.restore();
        }

        function animateRadar(canvas, targetValues, duration = 600) {
            const startValues = {};
            RADAR_AXES.forEach(a => startValues[a.key] = 0);
            const startTime = performance.now();
            const startRadar = () => {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(1, elapsed / duration);
                const ease = 1 - Math.pow(1 - progress, 3);
                const current = {};
                RADAR_AXES.forEach(a => {
                    current[a.key] = startValues[a.key] + (targetValues[a.key] - startValues[a.key]) * ease;
                });
                drawRadarChart(canvas, current, canvas.width);
                if (progress < 1) requestAnimationFrame(startRadar);
            };
            requestAnimationFrame(startRadar);
        }
