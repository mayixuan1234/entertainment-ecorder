<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>娱乐记录</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // 主题配色 - 薄荷绿
                        mint: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                        },
                        // 主题配色 - 樱花粉
                        sakura: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f9a8d4',
                            400: '#f472b6',
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                            800: '#9d174d',
                            900: '#831843',
                        },
                        // 主题配色 - 星空蓝
                        starry: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        // 主题配色 - 暖阳橙
                        sunshine: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                            900: '#7c2d12',
                        },
                        // 深色模式
                        dark: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'scale-in': 'scaleIn 0.2s ease-out',
                        'bounce-in': 'bounceIn 0.4s ease-out',
                        'pulse-soft': 'pulseSoft 2s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        bounceIn: {
                            '0%': { opacity: '0', transform: 'scale(0.3)' },
                            '50%': { transform: 'scale(1.05)' },
                            '70%': { transform: 'scale(0.9)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        pulseSoft: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.7' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* 主题样式变量 */
        :root {
            --primary-500: #14b8a6;
            --primary-600: #0d9488;
            --accent-500: #f472b6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
        }

        /* 深色模式 */
        .dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        /* 卡片悬浮效果 */
        .card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s;
        }
        
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.12), 0 6px 10px -4px rgba(0, 0, 0, 0.08);
        }

        /* 输入框聚焦效果 */
        .input-focus:focus {
            outline: none;
            border-color: var(--primary-500);
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.15);
        }

        /* 按钮点击效果 */
        .btn-active:active {
            transform: scale(0.98);
        }

        /* 隐藏滚动条 */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 自定义下拉箭头 */
        .select-wrapper {
            position: relative;
        }
        .select-wrapper::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-secondary);
        }

        /* 星级评分 */
        .star-rating {
            display: flex;
            gap: 2px;
        }
        .star-rating i {
            cursor: pointer;
            transition: color 0.15s;
            font-size: 1.25rem;
        }
        .star-rating i:hover,
        .star-rating i.active {
            color: #fbbf24;
        }

        /* 进度条 */
        .progress-bar {
            height: 8px;
            border-radius: 4px;
            background-color: #e2e8f0;
            overflow: hidden;
        }
        .dark-mode .progress-bar {
            background-color: #334155;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* 标签样式 */
        .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        .tag:hover {
            transform: translateY(-1px);
        }

        /* 图鉴解锁动画 */
        .unlock-animation {
            animation: unlockBounce 0.6s ease-out;
        }
        @keyframes unlockBounce {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(0deg); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 统计卡片 */
        .stat-card {
            background: linear-gradient(135deg, var(--primary-500) 0%, var(--accent-500) 100%);
        }
    </style>
</head>
<body class="min-h-screen pb-12 dark-mode:bg-dark-900">

    <!-- 顶部导航 -->
    <header class="bg-white/80 dark-mode:bg-dark-800/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100 dark-mode:border-dark-700">
        <nav class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <!-- 网站标题 -->
                <h1 class="text-xl font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-primary-500"></i>
                    娱乐记录
                </h1>
                
                <!-- 分类导航 -->
                <div class="flex items-center gap-3">
                    <!-- 搜索框 -->
                    <div class="relative hidden sm:block">
                        <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="搜索记录..."
                            class="pl-10 pr-4 py-2 rounded-full bg-gray-100 dark-mode:bg-dark-700 border-none text-sm input-focus w-48"
                        >
                    </div>
                    
                    <!-- 分类按钮 -->
                    <div class="flex gap-1 overflow-x-auto pb-1 scrollbar-hide">
                        <button 
                            onclick="filterRecords('all')" 
                            class="category-btn active px-4 py-2 text-sm font-medium rounded-full bg-primary-500 text-white transition-all"
                            data-category="all"
                        >
                            <i class="fa-solid fa-layer-group mr-1"></i> 全部
                        </button>
                        <button 
                            onclick="filterRecords('novel')" 
                            class="category-btn px-4 py-2 text-sm font-medium rounded-full bg-gray-100 dark-mode:bg-dark-700 hover:bg-gray-200 dark-mode:hover:bg-dark-600 transition-all"
                            data-category="novel"
                        >
                            <i class="fa-solid fa-book mr-1"></i> 小说
                        </button>
                        <button 
                            onclick="filterRecords('tv')" 
                            class="category-btn px-4 py-2 text-sm font-medium rounded-full bg-gray-100 dark-mode:bg-dark-700 hover:bg-gray-200 dark-mode:hover:bg-dark-600 transition-all"
                            data-category="tv"
                        >
                            <i class="fa-solid fa-tv mr-1"></i> 电视剧
                        </button>
                        <button 
                            onclick="filterRecords('movie')" 
                            class="category-btn px-4 py-2 text-sm font-medium rounded-full bg-gray-100 dark-mode:bg-dark-700 hover:bg-gray-200 dark-mode:hover:bg-dark-600 transition-all"
                            data-category="movie"
                        >
                            <i class="fa-solid fa-film mr-1"></i> 电影
                        </button>
                        <button 
                            onclick="filterRecords('game')" 
                            class="category-btn px-4 py-2 text-sm font-medium rounded-full bg-gray-100 dark-mode:bg-dark-700 hover:bg-gray-200 dark-mode:hover:bg-dark-600 transition-all"
                            data-category="game"
                        >
                            <i class="fa-solid fa-gamepad mr-1"></i> 游戏
                        </button>
                    </div>
                    
                    <!-- 设置按钮 -->
                    <button 
                        onclick="toggleSettings()" 
                        class="p-2 rounded-full hover:bg-gray-100 dark-mode:hover:bg-dark-700 transition-all"
                    >
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- 主内容区 -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- 设置面板 -->
        <div id="settingsPanel" class="bg-white dark-mode:bg-dark-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark-mode:border-dark-700 mb-8 hidden animate-fade-in">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 主题颜色 -->
                <div>
                    <h3 class="text-sm font-semibold mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-palette"></i> 主题颜色
                    </h3>
                    <div class="flex gap-2">
                        <button onclick="setTheme('mint')" class="w-10 h-10 rounded-full bg-mint-500 hover:ring-2 hover:ring-offset-2 hover:ring-mint-500 transition-all" title="薄荷绿"></button>
                        <button onclick="setTheme('sakura')" class="w-10 h-10 rounded-full bg-sakura-500 hover:ring-2 hover:ring-offset-2 hover:ring-sakura-500 transition-all" title="樱花粉"></button>
                        <button onclick="setTheme('starry')" class="w-10 h-10 rounded-full bg-starry-500 hover:ring-2 hover:ring-offset-2 hover:ring-starry-500 transition-all" title="星空蓝"></button>
                        <button onclick="setTheme('sunshine')" class="w-10 h-10 rounded-full bg-sunshine-500 hover:ring-2 hover:ring-offset-2 hover:ring-sunshine-500 transition-all" title="暖阳橙"></button>
                    </div>
                </div>
                
                <!-- 深色模式 -->
                <div>
                    <h3 class="text-sm font-semibold mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-moon"></i> 深色模式
                    </h3>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="darkModeToggle" class="sr-only peer" onchange="toggleDarkMode()">
                        <div class="w-11 h-6 bg-gray-200 dark-mode:bg-dark-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-500"></div>
                    </label>
                </div>
                
                <!-- 排序方式 -->
                <div>
                    <h3 class="text-sm font-semibold mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-arrow-up-down"></i> 排序方式
                    </h3>
                    <select id="sortSelect" onchange="handleSortChange()" class="px-3 py-2 rounded-lg border border-gray-200 dark-mode:border-dark-600 bg-gray-50 dark-mode:bg-dark-700 text-sm">
                        <option value="newest">最新添加</option>
                        <option value="oldest">最早添加</option>
                        <option value="rating">评分最高</option>
                        <option value="name">名称排序</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 统计面板 -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="stat-card rounded-2xl p-5 text-white shadow-lg">
                <div class="text-sm opacity-80 mb-1">总记录</div>
                <div class="text-3xl font-bold" id="totalCount">0</div>
            </div>
            <div class="bg-white dark-mode:bg-dark-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark-mode:border-dark-700">
                <div class="text-sm text-gray-500 dark-mode:text-dark-400 mb-1">已完成</div>
                <div class="text-3xl font-bold text-green-500" id="completedCount">0</div>
            </div>
            <div class="bg-white dark-mode:bg-dark-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark-mode:border-dark-700">
                <div class="text-sm text-gray-500 dark-mode:text-dark-400 mb-1">平均评分</div>
                <div class="text-3xl font-bold text-yellow-500" id="avgRating">0.0</div>
            </div>
            <div class="bg-white dark-mode:bg-dark-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark-mode:border-dark-700">
                <div class="text-sm text-gray-500 dark-mode:text-dark-400 mb-1">图鉴进度</div>
                <div class="text-3xl font-bold text-purple-500" id="collectionProgress">0%</div>
            </div>
        </section>

        <!-- 新增记录模块 -->
        <section class="bg-white dark-mode:bg-dark-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark-mode:border-dark-700 mb-8">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-primary-500"></i>
                新增记录
            </h2>
            
            <form id="addForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- 名称输入 -->
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-600 dark-mode:text-dark-300 mb-1.5">名称</label>
                        <input 
                            type="text" 
                            id="name" 
                            placeholder="输入作品名称"
                            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark-mode:border-dark-600 bg-gray-50 dark-mode:bg-dark-700 input-focus transition-colors"
                            required
                        >
                    </div>
                    
                    <!-- 类型选择 -->
                    <div>
                        <label for="type" class="block text-sm font-medium text-gray-600 dark-mode:text-dark-300 mb-1.5">类型</label>
                        <div class="select-wrapper">
                            <select 
                                id="type" 
                                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark-mode:border-dark-600 bg-gray-50 dark-mode:bg-dark-700 input-focus transition-colors appearance-none cursor-pointer pr-10"
                                required
                            >
                                <option value="" disabled selected>请选择类型</option>
                                <option value="novel">小说</option>
                                <option value="tv">电视剧</option>
                                <option value="movie">电影</option>
                                <option value="game">游戏</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- 评分 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 dark-mode:text-dark-300 mb-1.5">评分</label>
                        <div class="star-rating" id="starRating">
                            <i class="fa-solid fa-star text-gray-300" data-value="1"></i>
                            <i class="fa-solid fa-star text-gray-300" data-value="2"></i>
                            <i class="fa-solid fa-star text-gray-300" data-value="3"></i>
                            <i class="fa-solid fa-star text-gray-300" data-value="4"></i>
                            <i class="fa-solid fa-star text-gray-300" data-value="5"></i>
                        </div>
                        <input type="hidden" id="rating" value="0">
                    </div>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- 进度 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600 dark-mode:text-dark-300 mb-1.5">进度</label>
                        <div class="flex gap-2">
                            <input 
                                type="number" 
                                id="progressCurrent" 
                                placeholder="当前"
                                min="0"
                                class="w-20 px-3 py-2.5 rounded-xl border border-gray-200 dark-mode:border-dark-600 bg-gray-50 dark-mode:bg-dark-700 input-focus text-center"
                            >
                            <span class="self-center text-gray-400">/</span>
                            <input 
                                type="number" 
                                id="progressTotal" 
                                placeholder="总数"
                                min="0"
                                class="w-20 px-3 py-2.5 rounded-xl border border-gray-200 dark-mode:border-dark-600 bg-gray-50 dark-mode:bg-dark-700 input-focus text-center"
                            >
                            <span class="self-center text-sm text-gray-500 dark-mode:text-dark-400">（如：第5章/共20章）</span>
                        </div>
                    </div>
                    
                    <!-- 标签 -->
                    <div>
                        <label for="tags" class="block text-sm font-medium text-gray-600 dark-mode:text-dark-300 mb-1.5">标签（用逗号分隔）</label>
                        <input 
                            type="text" 
                            id="tags" 
                            placeholder="如：好看, 推荐, 治愈"
                            class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark-mode:border-dark-600 bg-gray-50 dark-mode:bg-dark-700 input-focus transition-colors"
                        >
                    </div>
                </div>
                
                <!-- 备注输入 -->
                <div>
                    <label for="note" class="block text-sm font-medium text-gray-600 dark-mode:text-dark-300 mb-1.5">备注</label>
                    <textarea 
                        id="note" 
                        rows="2" 
                        placeholder="简单描述你的感受（可选）"
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark-mode:border-dark-600 bg-gray-50 dark-mode:bg-dark-700 input-focus transition-colors resize-none"
                    ></textarea>
                </div>
                
                <!-- 提交按钮 -->
                <button 
                    type="submit" 
                    class="w-full py-3 rounded-xl bg-primary-500 text-white font-medium hover:bg-primary-600 transition-all btn-active flex items-center justify-center gap-2"
                >
                    <i class="fa-solid fa-plus"></i>
                    添加记录
                </button>
            </form>
        </section>

        <!-- 图鉴面板 -->
        <section class="bg-white dark-mode:bg-dark-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark-mode:border-dark-700 mb-8">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-trophy text-yellow-500"></i>
                成就图鉴
            </h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-3">
                <!-- 图鉴项 -->
                <div id="badge-novel" class="text-center p-3 rounded-xl bg-gray-50 dark-mode:bg-dark-700 border border-gray-100 dark-mode:border-dark-600">
                    <div class="w-12 h-12 mx-auto mb-2 rounded-full bg-gray-200 dark-mode:bg-dark-600 flex items-center justify-center">
                        <i class="fa-solid fa-book text-gray-400"></i>
                    </div>
                    <div class="text-sm font-medium">小说入门</div>
                    <div class="text-xs text-gray-400">记录1本小说</div>
                </div>
                <div id="badge-tv" class="text-center p-3 rounded-xl bg-gray-50 dark-mode:bg-dark-700 border border-gray-100 dark-mode:border-dark-600">
                    <div class="w-12 h-12 mx-auto mb-2 rounded-full bg-gray-200 dark-mode:bg-dark-600 flex items-center justify-center">
                        <i class="fa-solid fa-tv text-gray-400"></i>
                    </div>
                    <div class="text-sm font-medium">追剧达人</div>
                    <div class="text-xs text-gray-400">记录5部剧集</div>
                </div>
                <div id="badge-movie" class="text-center p-3 rounded-xl bg-gray-50 dark-mode:bg-dark-700 border border-gray-100 dark-mode:border-dark-600">
                    <div class="w-12 h-12 mx-auto mb-2 rounded-full bg-gray-200 dark-mode:bg-dark-600 flex items-center justify-center">
                        <i class="fa-solid fa-film text-gray-400"></i>
                    </div>
                    <div class="text-sm font-medium">电影迷</div>
                    <div class="text-xs text-gray-400">记录10部电影</div>
                </div>
                <div id="badge-game" class="text-center p-3 rounded-xl bg-gray-50 dark-mode:bg-dark-700 border border-gray-100 dark-mode:border-dark-600">
                    <div class="w-12 h-12 mx-auto mb-2 rounded-full bg-gray-200 dark-mode:bg-dark-600 flex items-center justify-center">
                        <i class="fa-solid fa-gamepad text-gray-400"></i>
                    </div>
                    <div class="text-sm font-medium">游戏玩家</div>
                    <div class="text-xs text-gray-400">记录3款游戏</div>
                </div>
                <div id="badge-rating" class="text-center p-3 rounded-xl bg-gray-50 dark-mode:bg-dark-700 border border-gray-100 dark-mode:border-dark-600">
                    <div class="w-12 h-12 mx-auto mb-2 rounded-full bg-gray-200 dark-mode:bg-dark-600 flex items-center justify-center">
                        <i class="fa-solid fa-star text-gray-400"></i>
                    </div>
                    <div class="text-sm font-medium">鉴赏家</div>
                    <div class="text-xs text-gray-400">给5部作品评分</div>
                </div>
                <div id="badge-complete" class="text-center p-3 rounded-xl bg-gray-50 dark-mode:bg-dark-700 border border-gray-100 dark-mode:border-dark-600">
                    <div class="w-12 h-12 mx-auto mb-2 rounded-full bg-gray-200 dark-mode:bg-dark-600 flex items-center justify-center">
                        <i class="fa-solid fa-check-circle text-gray-400"></i>
                    </div>
                    <div class="text-sm font-medium">完成者</div>
                    <div class="text-xs text-gray-400">完成10部作品</div>
                </div>
            </div>
        </section>

        <!-- 记录展示模块 -->
        <section>
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <i class="fa-solid fa-list text-gray-400"></i>
                        我的记录
                    </h2>
                    <span id="countBadge" class="px-3 py-1 text-xs font-medium rounded-full bg-gray-100 dark-mode:bg-dark-700 text-gray-500 dark-mode:text-dark-400">
                        共 0 条
                    </span>
                </div>
                <div class="flex gap-2">
                    <button onclick="exportData()" class="px-4 py-2 text-sm font-medium rounded-lg border border-gray-200 dark-mode:border-dark-600 hover:bg-gray-50 dark-mode:hover:bg-dark-700 transition-all flex items-center gap-2">
                        <i class="fa-solid fa-download"></i>
                        导出数据
                    </button>
                    <button onclick="clearAllData()" class="px-4 py-2 text-sm font-medium rounded-lg border border-red-200 text-red-500 hover:bg-red-50 transition-all flex items-center gap-2">
                        <i class="fa-solid fa-trash"></i>
                        清空数据
                    </button>
                </div>
            </div>
            
            <!-- 记录列表 -->
            <div id="recordsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                <!-- 空状态 -->
                <div id="emptyState" class="col-span-full py-16 text-center">
                    <div class="w-24 h-24 mx-auto mb-4 bg-gray-100 dark-mode:bg-dark-700 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-inbox text-4xl text-gray-300"></i>
                    </div>
                    <p class="text-gray-500 dark-mode:text-dark-400 mb-2">暂无记录</p>
                    <p class="text-sm text-gray-400">点击上方"新增记录"开始添加您的娱乐清单</p>
                </div>
            </div>
        </section>

    </main>

    <!-- 页脚 -->
    <footer class="text-center py-6 text-sm text-gray-400">
        <p>数据存储在本地浏览器中，清除浏览器数据会导致记录丢失</p>
    </footer>

    <!-- 确认删除弹窗 -->
    <div id="deleteModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center px-4">
        <div class="bg-white dark-mode:bg-dark-800 rounded-2xl p-6 w-full max-w-sm shadow-xl animate-scale-in">
            <div class="text-center">
                <div class="w-14 h-14 mx-auto mb-4 bg-red-50 dark-mode:bg-red-900/20 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-trash text-red-400 text-xl"></i>
                </div>
                <h3 class="text-lg font-semibold mb-2">确认删除</h3>
                <p class="text-gray-500 dark-mode:text-dark-400 text-sm mb-6">确定要删除这条记录吗？此操作无法撤销。</p>
                <div class="flex gap-3">
                    <button 
                        onclick="closeModal()" 
                        class="flex-1 py-2.5 rounded-xl border border-gray-200 dark-mode:border-dark-600 text-gray-600 dark-mode:text-dark-300 font-medium hover:bg-gray-50 dark-mode:hover:bg-dark-700 transition-all btn-active"
                    >
                        取消
                    </button>
                    <button 
                        id="confirmDeleteBtn" 
                        class="flex-1 py-2.5 rounded-xl bg-red-500 text-white font-medium hover:bg-red-600 transition-all btn-active"
                    >
                        删除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript 代码 -->
    <script>
        /**
         * ====================
         * 配置与状态
         * ====================
         */
        
        // 存储键名
        const STORAGE_KEY = 'entertainment_records';
        const THEME_KEY = 'entertainment_theme';
        const DARK_MODE_KEY = 'entertainment_dark_mode';
        
        // 当前状态
        let currentFilter = 'all';
        let currentSort = 'newest';
        let deleteTargetId = null;
        let selectedRating = 0;
        
        // 主题配置
        const THEMES = {
            mint: { primary: '#14b8a6', secondary: '#0d9488', accent: '#f472b6' },
            sakura: { primary: '#ec4899', secondary: '#db2777', accent: '#f472b6' },
            starry: { primary: '#3b82f6', secondary: '#2563eb', accent: '#8b5cf6' },
            sunshine: { primary: '#f97316', secondary: '#ea580c', accent: '#fbbf24' },
        };
        
        // 类型配置映射
        const TYPE_CONFIG = {
            novel: { label: '小说', icon: 'fa-book', color: 'bg-blue-50 text-blue-500 dark-mode:bg-blue-900/30' },
            tv: { label: '电视剧', icon: 'fa-tv', color: 'bg-purple-50 text-purple-500 dark-mode:bg-purple-900/30' },
            movie: { label: '电影', icon: 'fa-film', color: 'bg-orange-50 text-orange-500 dark-mode:bg-orange-900/30' },
            game: { label: '游戏', icon: 'fa-gamepad', color: 'bg-green-50 text-green-500 dark-mode:bg-green-900/30' }
        };

        /**
         * ====================
         * 数据层 (Data Layer)
         * ====================
         */
        
        function getRecords() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                console.error('读取存储失败:', e);
                return [];
            }
        }
        
        function saveRecords(records) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
                updateStats();
                updateBadges();
            } catch (e) {
                console.error('保存存储失败:', e);
            }
        }
        
        function addRecord(record) {
            const records = getRecords();
            records.unshift(record);
            saveRecords(records);
        }
        
        function deleteRecord(id) {
            const records = getRecords();
            const filtered = records.filter(r => r.id !== id);
            saveRecords(filtered);
        }
        
        function clearAllData() {
            if (confirm('确定要清空所有记录吗？此操作无法撤销！')) {
                localStorage.removeItem(STORAGE_KEY);
                renderRecords();
                updateStats();
                updateBadges();
            }
        }
        
        function exportData() {
            const records = getRecords();
            const dataStr = JSON.stringify(records, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `娱乐记录_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        /**
         * ====================
         * 统计与图鉴
         * ====================
         */
        
        function updateStats() {
            const records = getRecords();
            
            // 总记录数
            document.getElementById('totalCount').textContent = records.length;
            
            // 已完成数
            const completed = records.filter(r => r.progressCurrent && r.progressTotal && r.progressCurrent >= r.progressTotal).length;
            document.getElementById('completedCount').textContent = completed;
            
            // 平均评分
            const ratedRecords = records.filter(r => r.rating > 0);
            const avgRating = ratedRecords.length > 0 
                ? (ratedRecords.reduce((sum, r) => sum + r.rating, 0) / ratedRecords.length).toFixed(1)
                : '0.0';
            document.getElementById('avgRating').textContent = avgRating;
            
            // 图鉴进度
            const totalBadges = 6;
            const unlockedBadges = countUnlockedBadges(records);
            document.getElementById('collectionProgress').textContent = `${Math.round((unlockedBadges / totalBadges) * 100)}%`;
        }
        
        function countUnlockedBadges(records) {
            let count = 0;
            // 小说入门：记录1本小说
            if (records.filter(r => r.type === 'novel').length >= 1) count++;
            // 追剧达人：记录5部剧集
            if (records.filter(r => r.type === 'tv').length >= 5) count++;
            // 电影迷：记录10部电影
            if (records.filter(r => r.type === 'movie').length >= 10) count++;
            // 游戏玩家：记录3款游戏
            if (records.filter(r => r.type === 'game').length >= 3) count++;
            // 鉴赏家：给5部作品评分
            if (records.filter(r => r.rating > 0).length >= 5) count++;
            // 完成者：完成10部作品
            const completed = records.filter(r => r.progressCurrent && r.progressTotal && r.progressCurrent >= r.progressTotal).length;
            if (completed >= 10) count++;
            return count;
        }
        
        function updateBadges() {
            const records = getRecords();
            
            // 小说入门
            updateBadge('badge-novel', records.filter(r => r.type === 'novel').length >= 1, 'book', '#14b8a6');
            
            // 追剧达人
            updateBadge('badge-tv', records.filter(r => r.type === 'tv').length >= 5, 'tv', '#8b5cf6');
            
            // 电影迷
            updateBadge('badge-movie', records.filter(r => r.type === 'movie').length >= 10, 'film', '#f97316');
            
            // 游戏玩家
            updateBadge('badge-game', records.filter(r => r.type === 'game').length >= 3, 'gamepad', '#22c55e');
            
            // 鉴赏家
            updateBadge('badge-rating', records.filter(r => r.rating > 0).length >= 5, 'star', '#fbbf24');
            
            // 完成者
            const completed = records.filter(r => r.progressCurrent && r.progressTotal && r.progressCurrent >= r.progressTotal).length;
            updateBadge('badge-complete', completed >= 10, 'check-circle', '#10b981');
        }
        
        function updateBadge(id, unlocked, icon, color) {
            const badge = document.getElementById(id);
            if (unlocked) {
                badge.classList.add('unlock-animation');
                badge.style.background = `linear-gradient(135deg, ${color}20 0%, ${color}10 100%)`;
                badge.style.borderColor = color;
                const iconEl = badge.querySelector('i');
                iconEl.style.color = color;
                iconEl.parentElement.style.background = `${color}20`;
            }
        }

        /**
         * ====================
         * 渲染层 (Render Layer)
         * ====================
         */
        
        function renderRecords() {
            const records = getRecords();
            const container = document.getElementById('recordsContainer');
            const emptyState = document.getElementById('emptyState');
            const countBadge = document.getElementById('countBadge');
            
            // 筛选
            let filteredRecords = filter === 'all' ? records : records.filter(r => r.type === currentFilter);
            
            // 搜索
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            if (searchText) {
                filteredRecords = filteredRecords.filter(r => 
                    r.name.toLowerCase().includes(searchText) ||
                    (r.note && r.note.toLowerCase().includes(searchText)) ||
                    (r.tags && r.tags.some(t => t.toLowerCase().includes(searchText)))
                );
            }
            
            // 排序
            filteredRecords.sort((a, b) => {
                switch (currentSort) {
                    case 'newest': return new Date(b.date) - new Date(a.date);
                    case 'oldest': return new Date(a.date) - new Date(b.date);
                    case 'rating': return b.rating - a.rating;
                    case 'name': return a.name.localeCompare(b.name, 'zh-CN');
                    default: return 0;
                }
            });
            
            // 更新计数
            countBadge.textContent = `共 ${filteredRecords.length} 条`;
            
            // 清空容器
            container.innerHTML = '';
            
            // 空状态处理
            if (filteredRecords.length === 0) {
                container.appendChild(emptyState);
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            // 渲染卡片
            filteredRecords.forEach((record, index) => {
                const config = TYPE_CONFIG[record.type] || TYPE_CONFIG.novel;
                const card = createRecordCard(record, config);
                card.style.animationDelay = `${index * 50}ms`;
                container.appendChild(card);
            });
        }
        
        function createRecordCard(record, config) {
            const card = document.createElement('div');
            card.className = 'bg-white dark-mode:bg-dark-800 rounded-xl p-5 shadow-sm border border-gray-100 dark-mode:border-dark-700 card-hover animate-slide-up';
            
            // 评分星星
            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                starsHtml += `<i class="fa-solid fa-star ${i <= record.rating ? 'text-yellow-400' : 'text-gray-200 dark-mode:text-dark-600'}"></i>`;
            }
            
            // 进度条
            let progressHtml = '';
            if (record.progressCurrent && record.progressTotal) {
                const percent = Math.min(100, Math.round((record.progressCurrent / record.progressTotal) * 100));
                const isComplete = record.progressCurrent >= record.progressTotal;
                progressHtml = `
                    <div class="mt-3">
                        <div class="flex justify-between text-xs text-gray-400 mb-1">
                            <span>进度</span>
                            <span>${record.progressCurrent}/${record.progressTotal} (${percent}%)</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill ${isComplete ? 'bg-green-500' : 'bg-primary-500'}" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            }
            
            // 标签
            let tagsHtml = '';
            if (record.tags && record.tags.length > 0) {
                tagsHtml = `<div class="flex flex-wrap gap-2 mt-3">${record.tags.map(tag => 
                    `<span class="tag bg-gray-100 dark-mode:bg-dark-700 text-gray-600 dark-mode:text-dark-300">${tag}</span>`
                ).join('')}</div>`;
            }
            
            card.innerHTML = `
                <div class="flex items-start justify-between mb-3">
                    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium ${config.color}">
                        <i class="fa-solid ${config.icon}"></i>
                        ${config.label}
                    </span>
                    <button 
                        onclick="openDeleteModal('${record.id}')" 
                        class="p-1.5 rounded-lg text-gray-400 hover:bg-red-50 hover:text-red-500 transition-all"
                        aria-label="删除记录"
                    >
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
                <h3 class="text-base font-semibold mb-2 line-clamp-1">${escapeHtml(record.name)}</h3>
                <div class="star-rating justify-center mb-2">${starsHtml}</div>
                ${record.note ? `<p class="text-sm text-gray-500 dark-mode:text-dark-400 line-clamp-2">${escapeHtml(record.note)}</p>` : ''}
                ${progressHtml}
                ${tagsHtml}
                <div class="mt-4 pt-3 border-t border-gray-100 dark-mode:border-dark-700">
                    <span class="text-xs text-gray-400">${formatDate(record.date)}</span>
                </div>
            `;
            return card;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        /**
         * ====================
         * 主题与设置
         * ====================
         */
        
        function setTheme(themeName) {
            const theme = THEMES[themeName];
            if (!theme) return;
            
            document.documentElement.style.setProperty('--primary-500', theme.primary);
            document.documentElement.style.setProperty('--primary-600', theme.secondary);
            document.documentElement.style.setProperty('--accent-500', theme.accent);
            
            localStorage.setItem(THEME_KEY, themeName);
        }
        
        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem(DARK_MODE_KEY, isDark ? 'true' : 'false');
        }
        
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('hidden');
        }
        
        function handleSortChange() {
            currentSort = document.getElementById('sortSelect').value;
            renderRecords();
        }

        /**
         * ====================
         * 事件绑定层 (Event Layer)
         * ====================
         */
        
        function initEvents() {
            // 表单提交事件
            document.getElementById('addForm').addEventListener('submit', handleAddFormSubmit);
            
            // 确认删除按钮事件
            document.getElementById('confirmDeleteBtn').addEventListener('click', handleConfirmDelete);
            
            // ESC关闭弹窗
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
            
            // 点击遮罩关闭弹窗
            document.getElementById('deleteModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('deleteModal')) {
                    closeModal();
                }
            });
            
            // 星级评分
            document.querySelectorAll('#starRating i').forEach(star => {
                star.addEventListener('click', () => {
                    selectedRating = parseInt(star.dataset.value);
                    document.querySelectorAll('#starRating i').forEach(s => {
                        s.classList.toggle('active', parseInt(s.dataset.value) <= selectedRating);
                        s.classList.toggle('text-yellow-400', parseInt(s.dataset.value) <= selectedRating);
                        s.classList.toggle('text-gray-300', parseInt(s.dataset.value) > selectedRating);
                    });
                    document.getElementById('rating').value = selectedRating;
                });
            });
            
            // 搜索
            document.getElementById('searchInput').addEventListener('input', renderRecords);
        }
        
        function handleAddFormSubmit(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const type = document.getElementById('type').value;
            const rating = parseInt(document.getElementById('rating').value);
            const progressCurrent = parseInt(document.getElementById('progressCurrent').value) || 0;
            const progressTotal = parseInt(document.getElementById('progressTotal').value) || 0;
            const tagsInput = document.getElementById('tags').value.trim();
            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : [];
            const note = document.getElementById('note').value.trim();
            
            if (!name || !type) return;
            
            const newRecord = {
                id: Date.now().toString(),
                name: name,
                type: type,
                rating: rating,
                progressCurrent: progressCurrent,
                progressTotal: progressTotal,
                tags: tags,
                note: note,
                date: new Date().toISOString()
            };
            
            addRecord(newRecord);
            renderRecords();
            
            // 重置表单
            document.getElementById('addForm').reset();
            selectedRating = 0;
            document.querySelectorAll('#starRating i').forEach(s => {
                s.classList.remove('active', 'text-yellow-400');
                s.classList.add('text-gray-300');
            });
            document.getElementById('rating').value = 0;
            
            // 滚动到记录列表
            document.getElementById('recordsContainer').scrollIntoView({ behavior: 'smooth' });
        }
        
        function filterRecords(category) {
            currentFilter = category;
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.dataset.category === category) {
                    btn.classList.remove('bg-gray-100', 'dark-mode:bg-dark-700', 'hover:bg-gray-200', 'dark-mode:hover:bg-dark-600');
                    btn.classList.add('bg-primary-500', 'text-white');
                } else {
                    btn.classList.add('bg-gray-100', 'dark-mode:bg-dark-700', 'hover:bg-gray-200', 'dark-mode:hover:bg-dark-600');
                    btn.classList.remove('bg-primary-500', 'text-white');
                }
            });
            
            renderRecords();
        }
        
        function openDeleteModal(id) {
            deleteTargetId = id;
            document.getElementById('deleteModal').classList.remove('hidden');
            document.getElementById('confirmDeleteBtn').focus();
        }
        
        function closeModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            deleteTargetId = null;
        }
        
        function handleConfirmDelete() {
            if (deleteTargetId) {
                deleteRecord(deleteTargetId);
                renderRecords();
                closeModal();
            }
        }

        /**
         * ====================
         * 初始化 (Init)
         * ====================
         */
        
        document.addEventListener('DOMContentLoaded', () => {
            // 加载主题
            const savedTheme = localStorage.getItem(THEME_KEY) || 'mint';
            setTheme(savedTheme);
            
            // 加载深色模式
            const isDark = localStorage.getItem(DARK_MODE_KEY) === 'true';
            if (isDark) {
                document.body.classList.add('dark-mode');
                document.getElementById('darkModeToggle').checked = true;
            }
            
            initEvents();
            renderRecords();
            updateStats();
            updateBadges();
        });
    </script>
</body>
</html>
