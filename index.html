                            </div>
                        `, true)}

                        ${charSection('生活日常、饮食、作息、家居、偏好厌恶', `
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                ${charText('wakeTime', '日常起床时间', values.wakeTime)}
                                ${charText('sleepTime', '固定入睡时间', values.sleepTime)}
                                ${charSelect('houseType', '居住房屋类型', values.houseType, opts.houseType)}
                                ${charSelect('decorStyle', '理想装修风格', values.decorStyle, opts.decorStyle)}
                                ${charSelect('dietPref', '饮食偏好', values.dietPref, opts.dietPref)}
                                ${charSlider('alcoholTolerance', '酒量', values.alcoholTolerance, '滴酒不沾', '千杯不醉', 0, 5, 1)}
                            </div>
                            <div class="grid grid-cols-1 gap-2 mt-2">
                                ${charText('favFood', '喜爱饮品 / 食物', values.favFood)}
                                ${charText('hatedFood', '厌恶食物 / 忌口食材', values.hatedFood)}
                                ${charText('hobbies', '爱好 / 兴趣', values.hobbies)}
                                ${charText('hates', '极度讨厌的事物', values.hates)}
                                ${charText('fears', '深层恐惧 / 排斥的东西', values.fears)}
                                ${charText('goodAt', '极其擅长的事', values.goodAt)}
                                ${charText('badAt', '完全不擅长的事', values.badAt)}
                                ${charText('collections', '特殊癖好 / 收藏习惯', values.collections)}
                            </div>
                        `, false)}

                        ${charSection('技能天赋评级表', `
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                ${charSlider('skillCooking', '料理烹饪', values.skillCooking, '极差', '精通', 0, 5, 1)}
                                ${charSlider('skillStudy', '读写学习', values.skillStudy, '极差', '精通', 0, 5, 1)}
                                ${charSlider('skillCreate', '创意创作', values.skillCreate, '极差', '精通', 0, 5, 1)}
                                ${charSlider('skillCombat', '实战格斗', values.skillCombat, '极差', '精通', 0, 5, 1)}
                                ${charSlider('skillFinance', '金融理财', values.skillFinance, '极差', '精通', 0, 5, 1)}
                                ${charSlider('skillSocial', '社交交际', values.skillSocial, '极差', '精通', 0, 5, 1)}
                                ${charSlider('skillLead', '团队领导', values.skillLead, '极差', '精通', 0, 5, 1)}
                                ${charSlider('skillAesthetic', '艺术审美', values.skillAesthetic, '极差', '精通', 0, 5, 1)}
                                ${charSlider('skillLogic', '推理逻辑', values.skillLogic, '极差', '精通', 0, 5, 1)}
                                ${charSlider('skillMusic', '乐器演奏', values.skillMusic, '极差', '精通', 0, 5, 1)}
                                ${charSlider('skillTech', '机械 / 科技', values.skillTech, '极差', '精通', 0, 5, 1)}
                                ${charSlider('skillSurvival', '野外求生', values.skillSurvival, '极差', '精通', 0, 5, 1)}
                            </div>
                        `, true)}

                        ${charSection('社会评价、三观与行为逻辑', `
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                ${charSlider('fame', '社会名望', values.fame, '无名小卒', '举世闻名', 0, 5, 1)}
                                ${charSlider('reputation', '名声倾向', values.reputation, '恶名缠身', '人人称赞', 0, 5, 1)}
                                ${charSlider('talent', '天赋评价', values.talent, '庸才平凡', '顶级天才', 0, 5, 1)}
                                ${charSlider('calmness', '情绪稳定', values.calmness, '暴躁易怒', '平静温和', 0, 5, 1)}
                                ${charSlider('politeness', '礼貌克制', values.politeness, '粗鲁无礼', '礼貌克制', 0, 5, 1)}
                            </div>
                            <div class="grid grid-cols-1 gap-2 mt-2">
                                ${charText('moneyView', '金钱观', values.moneyView)}
                                ${charText('powerView', '权力观', values.powerView)}
                                ${charText('strangerAttitude', '对待陌生人态度', values.strangerAttitude)}
                                ${charText('conflictHandle', '遇到冲突处理方式', values.conflictHandle)}
                            </div>
                        `, true)}

                        ${charSection('视觉图库与补充备注', `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                ${charText('imageMain', '主立绘 URL', values.imageMain)}
                                ${charText('imageDetail', '细节特写 URL', values.imageDetail)}
                                ${charText('imageChibi', 'Q版形象 URL', values.imageChibi)}
                                ${charText('imageOutfit', '服饰拆分 URL', values.imageOutfit)}
                                ${charText('imageWeapon', '武器道具 URL', values.imageWeapon)}
                            </div>
                            <div class="grid grid-cols-1 gap-2 mt-2">
                                ${charText('bgm', '角色专属 BGM / 代表歌曲', values.bgm)}
                                ${charSelect('livingStatus', '对自我生活状态自评', values.livingStatus, opts.livingStatus)}
                                ${charTextarea('notes', '制表 / 记录备注', values.notes, '', 3)}
                            </div>
                        `, true)}

                        <label class="flex flex-col gap-1 text-xs">
                            <span style="color: var(--text-muted);">标签（用逗号分隔）</span>
                            <input type="text" placeholder="温柔, 勇敢, 善良" value="${esc(tags)}" class="char-tags w-full px-3 py-2 rounded-xl border border-current opacity-60 bg-transparent input-focus text-sm">
                        </label>
                        <label class="flex flex-col gap-1 text-xs">
                            <span style="color: var(--text-muted);">说明</span>
                            <input type="text" placeholder="可填写扮演者、初次登场、人物关系等" value="${esc(values.note)}" class="char-note w-full px-3 py-2 rounded-xl border border-current opacity-60 bg-transparent input-focus text-sm">
                        </label>
                    </div>
                </div>
            `;

            // Bind radar inputs to canvas
            setTimeout(() => {
                const canvas = card.querySelector('.char-radar');
                animateRadar(canvas, radar, 0);
                const updateRadar = () => {
                    const currentRadar = {};
                    card.querySelectorAll('.char-radar-input').forEach(i => {
                        currentRadar[i.dataset.key] = Math.round((parseFloat(i.value) || 0) * 10) / 10;
                    });
                    drawRadarChart(canvas, currentRadar, canvas.width);
                };
                card.querySelectorAll('.char-radar-input').forEach(input => {
                    input.addEventListener('input', () => {
                        const num = card.querySelector(`.char-radar-num[data-key="${input.dataset.key}"]`);
                        if (num) num.value = Number(input.value).toFixed(1);
                        updateRadar();
                    });
                });
                card.querySelectorAll('.char-radar-num').forEach(input => {
                    input.addEventListener('input', () => {
                        let v = parseFloat(input.value) || 0;
                        if (v < 0) v = 0;
                        if (v > 10) v = 10;
                        v = Math.round(v * 10) / 10;
                        input.value = v.toFixed(1);
                        const slider = card.querySelector(`.char-radar-input[data-key="${input.dataset.key}"]`);
                        if (slider) slider.value = v;
                        updateRadar();
                    });
                });
                // 初始化折叠面板图标方向
                card.querySelectorAll('.char-section').forEach(section => {
                    const body = section.querySelector('.char-section-body');
                    const icon = section.querySelector('button i');
                    if (body && icon) icon.style.transform = body.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
                });
            }, 0);

            return card;
        }

        function addCharacterRow(mode, values) {
            const containerId = mode === 'edit' ? 'editCharactersContainer' : 'charactersContainer';
            const card = buildCharacterCard(mode, values);
            document.getElementById(containerId).appendChild(card);
            syncModalCharTabs(mode);
            // 切换到新增的角色（最后一个）
            const container = document.getElementById(containerId);
            const cards = container.querySelectorAll('.character-card');
            switchModalCharTab(mode, cards.length - 1);
        }

        function removeCharacterCard(btn) {
            const card = btn.closest('.character-card');
            const container = card.parentElement;
            const mode = container.id === 'editCharactersContainer' ? 'edit' : 'add';
            const cards = Array.from(container.querySelectorAll('.character-card'));
            const idx = cards.indexOf(card);
            if (cards.length <= 1) {
                alert('至少保留一个角色卡片');
                return;
            }
            card.remove();
            syncModalCharTabs(mode);
            const newCards = container.querySelectorAll('.character-card');
            switchModalCharTab(mode, Math.min(idx, newCards.length - 1));
        }

        function collectCharacters(mode) {
            const containerId = mode === 'edit' ? 'editCharactersContainer' : 'charactersContainer';
            const cards = document.getElementById(containerId).querySelectorAll('.character-card');
            const list = [];
            cards.forEach(card => {
                const nameInput = card.querySelector('.char-name');
                let name = (nameInput ? nameInput.value : '').trim();
                if (!name) {
                    name = '未命名角色';
                    if (nameInput) nameInput.value = name;
                }
                const radar = {};
                card.querySelectorAll('.char-radar-num').forEach(i => {
                    radar[i.dataset.key] = Math.round((parseFloat(i.value) || 0) * 10) / 10;
                });
                const tagsRaw = card.querySelector('.char-tags').value.trim();
                const char = {
                    name,
                    role: card.querySelector('.char-role').value || '',
                    image: card.querySelector('.char-image').value.trim() || '',
                    note: card.querySelector('.char-note').value.trim() || '',
                    tags: tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(t => t) : [],
                    radar
                };
                // 收集所有 data-char 详细字段（文本 / 下拉 / 滑块）
                card.querySelectorAll('.char-input[data-char], .char-slider[data-char]').forEach(i => {
                    char[i.dataset.char] = i.value.trim();
                });
                // 收集多选字段
                card.querySelectorAll('.char-multi-tags[data-char]').forEach(div => {
                    const vals = Array.from(div.querySelectorAll('.char-multi-tag')).map(t => t.childNodes[0].textContent.trim()).filter(t => t);
                    char[div.dataset.char] = vals;
                });
                list.push(char);
            });
            return list;
        }

        function renderCharacterRows(mode, characters = []) {
            const containerId = mode === 'edit' ? 'editCharactersContainer' : 'charactersContainer';
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (!characters || characters.length === 0) {
                addCharacterRow(mode);
            } else {
                characters.forEach((c, idx) => {
                    const card = buildCharacterCard(mode, c);
                    // 初始只显示第一个角色卡片，避免多个表单同时铺开展示
                    if (idx !== 0) card.classList.add('hidden');
                    container.appendChild(card);
                });
                syncModalCharTabs(mode);
                switchModalCharTab(mode, 0);
            }
        }

        function updateCpVisibility(mode, type) {
            const fieldId = mode === 'edit' ? 'editCpField' : 'cpField';
            document.getElementById(fieldId).classList.toggle('hidden', type !== 'fanfic');
        }

        function syncModalCharTabs(mode) {
            const tabsId = mode === 'edit' ? 'editCharTabs' : 'addCharTabs';
            const containerId = mode === 'edit' ? 'editCharactersContainer' : 'charactersContainer';
            const tabsBar = document.getElementById(tabsId);
            const cards = document.getElementById(containerId).querySelectorAll('.character-card');
            if (!tabsBar) return;
            // 保留最后的 "+ 新增" 按钮
            const addBtn = tabsBar.querySelector('.char-tab-add') || tabsBar.lastElementChild;
            tabsBar.innerHTML = '';
            cards.forEach((card, idx) => {
                const nameInput = card.querySelector('.char-name');
                const name = (nameInput ? nameInput.value.trim() : '') || `角色${idx + 1}`;
                const tab = document.createElement('button');
                tab.type = 'button';
                tab.className = 'modal-char-tab';
                tab.textContent = name;
                tab.dataset.charIdx = idx;
                tab.onclick = () => switchModalCharTab(mode, idx);
                // 删除按钮
                const remove = document.createElement('span');
                remove.className = 'tab-remove';
                remove.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                remove.onclick = (e) => removeModalCharTab(mode, idx, e);
                tab.appendChild(remove);
                tabsBar.appendChild(tab);
            });
            if (addBtn) tabsBar.appendChild(addBtn);
            updateModalCharTabActiveState(mode);
            // 监听角色名变化实时更新标签
            cards.forEach((card, idx) => {
                const nameInput = card.querySelector('.char-name');
                if (nameInput && !nameInput._tabSyncBound) {
                    nameInput._tabSyncBound = true;
                    nameInput.addEventListener('input', () => updateModalCharTabLabels(mode));
                }
            });
        }

        function updateModalCharTabLabels(mode) {
            const tabsId = mode === 'edit' ? 'editCharTabs' : 'addCharTabs';
            const containerId = mode === 'edit' ? 'editCharactersContainer' : 'charactersContainer';
            const tabsBar = document.getElementById(tabsId);
            const cards = document.getElementById(containerId).querySelectorAll('.character-card');
            if (!tabsBar) return;
            const tabs = tabsBar.querySelectorAll('.modal-char-tab');
            tabs.forEach((tab, idx) => {
                const card = cards[idx];
                if (!card) return;
                const name = card.querySelector('.char-name')?.value.trim() || `角色${idx + 1}`;
                // 保留删除按钮，只更新文本节点
                const remove = tab.querySelector('.tab-remove');
                tab.childNodes.forEach(node => {
                    if (node.nodeType === Node.TEXT_NODE) node.textContent = name;
                });
            });
        }

        function updateModalCharTabActiveState(mode) {
            const tabsId = mode === 'edit' ? 'editCharTabs' : 'addCharTabs';
            const containerId = mode === 'edit' ? 'editCharactersContainer' : 'charactersContainer';
            const tabsBar = document.getElementById(tabsId);
            const cards = document.getElementById(containerId).querySelectorAll('.character-card');
            if (!tabsBar) return;
            const tabs = tabsBar.querySelectorAll('.modal-char-tab');
            tabs.forEach((tab, idx) => {
                tab.classList.toggle('active', !cards[idx].classList.contains('hidden'));
            });
        }

        function switchModalCharTab(mode, idx) {
            const containerId = mode === 'edit' ? 'editCharactersContainer' : 'charactersContainer';
            const cards = document.getElementById(containerId).querySelectorAll('.character-card');
            cards.forEach((card, i) => {
                card.classList.toggle('hidden', i !== idx);
            });
            updateModalCharTabActiveState(mode);
            // 显示时重绘当前角色的雷达图
            const active = cards[idx];
            if (active) {
                const canvas = active.querySelector('.char-radar');
                const panel = active.querySelector('.radar-panel');
                if (canvas && panel && !panel.classList.contains('collapsed')) {
                    const radar = {};
                    active.querySelectorAll('.char-radar-num').forEach(i => radar[i.dataset.key] = parseFloat(i.value) || 0);
                    setTimeout(() => drawRadarChart(canvas, radar, 180, '角色能力'), 30);
                }
            }
        }

        function removeModalCharTab(mode, idx, event) {
            event.stopPropagation();
            const containerId = mode === 'edit' ? 'editCharactersContainer' : 'charactersContainer';
            const cards = Array.from(document.getElementById(containerId).querySelectorAll('.character-card'));
            if (cards.length <= 1) {
                alert('至少保留一个角色卡片');
                return;
            }
            cards[idx].remove();
            syncModalCharTabs(mode);
            const newCards = document.getElementById(containerId).querySelectorAll('.character-card');
            switchModalCharTab(mode, Math.min(idx, newCards.length - 1));
        }

        function initEvents() {
            // 点击页面空白处关闭顶部下拉菜单与角色字段下拉
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#themeDropdown') && !e.target.closest('[onclick*="toggleThemeDropdown"]')) {
                    closeThemeDropdown();
                }
                if (!e.target.closest('#categoryDropdown') && !e.target.closest('#categoryDropdownBtn')) {
                    closeCategoryDropdown();
                }
                if (!e.target.closest('#sortDropdown') && !e.target.closest('#sortDropdownBtn')) {
                    closeSortDropdown();
                }
                // 关闭弹窗自定义下拉
                if (!e.target.closest('.custom-select')) {
                    closeAllCustomSelects();
                }
                // 关闭所有角色字段下拉选项
                if (!e.target.closest('.char-select-wrapper') && !e.target.closest('.char-multi-wrapper')) {
                    document.querySelectorAll('.char-select-options').forEach(opts => opts.classList.add('hidden'));
                }
            });

            // Esc 关闭弹窗
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (!document.getElementById('noteModal').classList.contains('hidden')) closeNoteModal();
                    if (!document.getElementById('addModal').classList.contains('hidden')) closeAddModal();
                    if (!document.getElementById('editModal').classList.contains('hidden')) closeEditModal();
                    if (!document.getElementById('deleteModal').classList.contains('hidden')) closeModal();
                }
            });

            document.getElementById('addForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const newRecord = {
                    id: Date.now().toString(),
                    name: document.getElementById('name').value.trim(),
                    type: document.getElementById('type').value,
                    rating: parseInt(document.getElementById('rating').value) || 0,
                    progressCurrent: parseInt(document.getElementById('progressCurrent').value) || 0,
                    progressTotal: parseInt(document.getElementById('progressTotal').value) || 0,
                    readStatus: document.getElementById('readStatus').value,
                    tags: document.getElementById('tags').value.trim().split(',').map(t => t.trim()).filter(t => t),
                    note: document.getElementById('note').value.trim(),
                    author: document.getElementById('author').value.trim(),
                    platform: document.getElementById('platform').value,
                    wordCount: parseFloat(document.getElementById('wordCount').value) || 0,
                    sourceLink: document.getElementById('sourceLink').value.trim(),
                    chapterNote: document.getElementById('chapterNote').value.trim(),
                    coverUrl: document.getElementById('coverUrl').value.trim(),
                    cp: document.getElementById('cp').value.trim(),
                    characters: collectCharacters('add'),
                    date: new Date().toISOString()
                };
                addRecord(newRecord);
                renderRecords();
                document.getElementById('addForm').reset();
                selectedRating = 0;
                document.querySelectorAll('#starRating i').forEach(s => s.className = 'fa-solid fa-star text-gray-300 cursor-pointer');
                document.getElementById('rating').value = 0;
                setCustomSelectValue('type', '');
                setCustomSelectValue('readStatus', 'reading');
                setCustomSelectValue('platform', '');
                document.getElementById('novelFields').classList.add('hidden');
                document.getElementById('cpField').classList.add('hidden');
                renderCharacterRows('add', []);
                closeAddModal();
            });


            document.querySelectorAll('#starRating i').forEach(star => {
                star.addEventListener('click', () => {
                    selectedRating = parseInt(star.dataset.value);
                    document.querySelectorAll('#starRating i').forEach(s => {
                        s.className = `fa-solid fa-star cursor-pointer ${parseInt(s.dataset.value) <= selectedRating ? 'text-yellow-400' : 'text-gray-300'}`;
                    });
                    document.getElementById('rating').value = selectedRating;
                });
            });

            document.querySelectorAll('#editStarRating i').forEach(star => {
                star.addEventListener('click', () => {
                    const val = parseInt(star.dataset.value);
                    document.getElementById('editRating').value = val;
                    document.querySelectorAll('#editStarRating i').forEach(s => {
                        s.className = `fa-solid fa-star cursor-pointer ${parseInt(s.dataset.value) <= val ? 'text-yellow-400' : 'text-gray-300'}`;
                    });
                });
            });


            document.getElementById('editForm').addEventListener('submit', handleEditSubmit);
            document.getElementById('confirmDeleteBtn').addEventListener('click', handleConfirmDelete);
            document.getElementById('searchInput').addEventListener('input', renderRecords);
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { closeModal(); closeEditModal(); closeAddModal(); }
                if (e.key === '/' && !['input', 'textarea', 'select'].includes(e.target.tagName.toLowerCase())) {
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                }
                if (e.key === 'n' && !['input', 'textarea', 'select'].includes(e.target.tagName.toLowerCase())) {
                    e.preventDefault();
                    openAddModal();
                }
            });
        }

        function detectEmbeddedMode() {
            try {
                if (window.self !== window.top) {
                    document.body.classList.add('embedded');
                }
            } catch (e) {
                // 跨域 iframe 也视为内嵌
                document.body.classList.add('embedded');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            detectEmbeddedMode();
            const savedTheme = localStorage.getItem(THEME_KEY) || 'cosmic';
            setTheme(savedTheme);
            const isDark = localStorage.getItem(DARK_MODE_KEY) === 'true';
            if (isDark) {
                document.body.classList.add('dark-mode');
            }
            updateDarkModeToggleUI(isDark);
            initEvents();
            renderRecords();
            updateStats();
            updateBadges();
        });

    </script>
</body>
</html>
